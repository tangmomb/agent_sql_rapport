[project]
name = "sql-report-agent"
version = "0.1.0"
description = "Agent d'analyse SQL et de génération de rapports"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "sqlglot>=28,<31",
    "weasyprint>=69,<72",
]

[project.scripts]
report = "sql_report_agent.cli:report"
replay = "sql_report_agent.cli:replay"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
