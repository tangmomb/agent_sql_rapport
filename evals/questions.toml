[[case]]
id = "13-port-multipaiements"
question = "Pour les commandes livrées passées en 2018 avec au moins deux lignes de paiement, quel est le montant total des frais de port facturés sur les articles ? Donne des BRL au centime."
trap = "Le port est au grain article et serait multiplié par le nombre de paiements."
sql = """
WITH multipaiements AS (
    SELECT order_id FROM order_payments GROUP BY order_id HAVING COUNT(*) >= 2
)
SELECT ROUND(SUM(i.freight_value), 2) AS frais_port_brl
FROM orders AS o JOIN multipaiements USING (order_id) JOIN order_items AS i USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
"""
naive_sql = """
SELECT ROUND(SUM(i.freight_value), 2)
FROM orders AS o JOIN order_items AS i USING (order_id) JOIN order_payments AS p USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
  AND o.order_id IN (SELECT order_id FROM order_payments GROUP BY order_id HAVING COUNT(*) >= 2)
"""

