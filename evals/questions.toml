[[case]]
id = "30-produits-par-trimestre"
question = "Pour chacun des trois premiers trimestres de 2018, donne le numéro du trimestre en entier, le nombre de lignes d'articles et le nombre de produits distincts des commandes livrées passées durant le trimestre."
sql = """
WITH articles_livres AS (
    SELECT (CAST(STRFTIME('%m', o.order_purchase_timestamp) AS INTEGER) - 1) / 3 + 1 AS trimestre,
           i.product_id
    FROM orders AS o JOIN order_items AS i USING (order_id)
    WHERE o.order_status = 'delivered'
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-10-01'
)
SELECT trimestre, COUNT(*) AS articles, COUNT(DISTINCT product_id) AS produits_distincts
FROM articles_livres
GROUP BY trimestre
ORDER BY trimestre
"""
