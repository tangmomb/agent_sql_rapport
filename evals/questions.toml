[[case]]
id = "01-ca-livre"
question = "En BRL, quel est le chiffre d'affaires des articles hors port des commandes passées en 2017 au statut delivered ? Arrondis au centime."
trap = "Inclure les autres statuts gonfle le chiffre d'affaires des commandes livrées."
sql = """
SELECT ROUND(SUM(i.price), 2) AS ca_articles_brl
FROM orders AS o JOIN order_items AS i USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""
naive_sql = """
SELECT ROUND(SUM(i.price), 2)
FROM orders AS o JOIN order_items AS i USING (order_id)
WHERE o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""

[[case]]
id = "02-paiements-sans-articles"
question = "Quel montant total en BRL a été payé pour les commandes livrées passées en 2017 ? Compte chaque ligne de paiement une fois et arrondis au centime."
trap = "Joindre directement les articles répète les paiements des commandes multiarticles."
sql = """
SELECT ROUND(SUM(p.payment_value), 2) AS montant_paye_brl
FROM orders AS o JOIN order_payments AS p USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""
naive_sql = """
SELECT ROUND(SUM(p.payment_value), 2)
FROM orders AS o JOIN order_payments AS p USING (order_id)
JOIN order_items AS i USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""

[[case]]
id = "03-articles-avec-paiement"
question = "Pour les commandes livrées passées en 2017 avec au moins deux lignes de paiement enregistrées, calcule le total des prix des articles hors port en BRL, arrondi au centime."
trap = "Filtrer par une jointure simple vers les paiements répète les prix des articles."
sql = """
SELECT ROUND(SUM(i.price), 2) AS prix_articles_brl
FROM orders AS o JOIN order_items AS i USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
  AND o.order_id IN (SELECT order_id FROM order_payments GROUP BY order_id HAVING COUNT(*) >= 2)
"""
naive_sql = """
SELECT ROUND(SUM(i.price), 2)
FROM orders AS o JOIN order_items AS i USING (order_id)
JOIN order_payments AS p USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
  AND o.order_id IN (SELECT order_id FROM order_payments GROUP BY order_id HAVING COUNT(*) >= 2)
"""

[[case]]
id = "04-poids-avis"
question = "Parmi les commandes livrées passées en 2017 avec au moins un avis, quelle est la note moyenne à quatre décimales ? Moyenne d'abord les avis d'une même commande, puis donne le même poids à chaque commande."
trap = "Moyenner directement les avis donne plus de poids aux commandes ayant plusieurs avis."
sql = """
WITH notes AS (
    SELECT o.order_id, AVG(r.review_score) AS note
    FROM orders AS o JOIN order_reviews AS r USING (order_id)
    WHERE o.order_status = 'delivered'
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
    GROUP BY o.order_id
)
SELECT ROUND(AVG(note), 4) AS note_moyenne FROM notes
"""
naive_sql = """
SELECT ROUND(AVG(r.review_score), 4)
FROM orders AS o JOIN order_reviews AS r USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""

[[case]]
id = "05-delai-dates-manquantes"
question = "Tous millésimes confondus, quel est le délai moyen réel en jours entre achat et livraison client parmi les commandes au statut delivered avec date de livraison connue ? Arrondis à quatre décimales."
trap = "Remplacer une date de livraison manquante par un délai nul abaisse la moyenne."
sql = """
SELECT ROUND(AVG(julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp)), 4)
       AS delai_moyen_jours
FROM orders
WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
"""
naive_sql = """
SELECT ROUND(AVG(COALESCE(
    julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp), 0)), 4)
FROM orders
WHERE order_status = 'delivered'
"""

[[case]]
id = "06-multivendeurs"
question = "Combien de commandes livrées passées en 2018 contiennent des articles de plus d'un vendeur distinct ?"
trap = "Plusieurs articles d'un même vendeur ne constituent pas une commande multivendeur."
sql = """
SELECT COUNT(*) AS commandes_multivendeurs
FROM (
    SELECT o.order_id
    FROM orders AS o JOIN order_items AS i USING (order_id)
    WHERE o.order_status = 'delivered'
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY o.order_id
    HAVING COUNT(DISTINCT i.seller_id) > 1
)
"""
naive_sql = """
SELECT COUNT(*) FROM (
    SELECT o.order_id
    FROM orders AS o JOIN order_items AS i USING (order_id)
    WHERE o.order_status = 'delivered'
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY o.order_id HAVING COUNT(*) > 1
)
"""

[[case]]
id = "07-acheteurs-uniques"
question = "Combien d'acheteurs distincts de la ville sao paulo, État SP, ont passé au moins une commande livrée en 2017 ? L'année porte sur la date d'achat et la ville sur la fiche client de la commande."
trap = "customer_id recense les fiches par commande ; customer_unique_id identifie l'acheteur."
sql = """
SELECT COUNT(DISTINCT c.customer_unique_id) AS acheteurs_distincts
FROM orders AS o JOIN customers AS c USING (customer_id)
WHERE c.customer_city = 'sao paulo' AND c.customer_state = 'SP'
  AND o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""
naive_sql = """
SELECT COUNT(DISTINCT c.customer_id)
FROM orders AS o JOIN customers AS c USING (customer_id)
WHERE c.customer_city = 'sao paulo' AND c.customer_state = 'SP'
  AND o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""

[[case]]
id = "08-couverture-avis"
question = "Quel pourcentage des commandes livrées passées en 2017 a reçu au moins un avis ? Prends toutes les commandes livrées de cette cohorte comme dénominateur et arrondis à quatre décimales."
trap = "Le nombre d'avis n'est pas le nombre de commandes ayant au moins un avis."
sql = """
SELECT ROUND(100.0 * SUM(EXISTS (
    SELECT 1 FROM order_reviews AS r WHERE r.order_id = o.order_id
)) / COUNT(*), 4) AS pourcentage_avec_avis
FROM orders AS o
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""
naive_sql = """
SELECT ROUND(100.0 * COUNT(r.review_id) / COUNT(DISTINCT o.order_id), 4)
FROM orders AS o LEFT JOIN order_reviews AS r USING (order_id)
WHERE o.order_status = 'delivered'
  AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
"""

[[case]]
id = "09-geolocalisation-unique"
question = "Dans la table customers, combien de fiches de l'État AC ont un préfixe postal présent au moins une fois dans geolocation ? Fais la correspondance sur le seul préfixe postal."
trap = "Une jointure avec les coordonnées répète la fiche client pour chaque point géographique."
sql = """
SELECT COUNT(*) AS fiches_clients
FROM customers AS c
WHERE c.customer_state = 'AC' AND EXISTS (
    SELECT 1 FROM geolocation AS g
    WHERE g.geolocation_zip_code_prefix = c.customer_zip_code_prefix
)
"""
naive_sql = """
SELECT COUNT(*)
FROM customers AS c JOIN geolocation AS g
ON g.geolocation_zip_code_prefix = c.customer_zip_code_prefix
WHERE c.customer_state = 'AC'
"""

