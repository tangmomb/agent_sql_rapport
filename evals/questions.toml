[[case]]
id = "26-categories-articles"
question = "Pour les commandes livrées passées en 2018, quelles sont les cinq catégories traduites en anglais avec le plus de lignes d'articles ? Donne la catégorie anglaise et le nombre d'articles, et départage les ex aequo par catégorie croissante."
sql = """
SELECT p.product_category_name_english AS categorie, COUNT(*) AS articles
FROM orders AS o JOIN order_items AS i USING (order_id) JOIN products_en AS p USING (product_id)
WHERE o.order_status = 'delivered' AND p.product_category_name_english IS NOT NULL
  AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2019-01-01'
GROUP BY categorie
ORDER BY articles DESC, categorie
LIMIT 5
"""

[[case]]
id = "27-mediane-delai"
question = "Quel est le délai médian en jours fractionnaires entre achat et livraison client pour les commandes au statut delivered passées en juillet 2017, avec date de livraison connue ? Pour un effectif pair, prends la moyenne des deux valeurs centrales. Arrondis à trois décimales."
sql = """
WITH delais AS (
    SELECT julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp) AS jours
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
      AND order_purchase_timestamp >= '2017-07-01' AND order_purchase_timestamp < '2017-08-01'
), tries AS (
    SELECT jours, ROW_NUMBER() OVER (ORDER BY jours) AS position, COUNT(*) OVER () AS effectif
    FROM delais
)
SELECT ROUND(AVG(jours), 3) AS delai_median_jours FROM tries
WHERE position IN ((effectif + 1) / 2, (effectif + 2) / 2)
"""

