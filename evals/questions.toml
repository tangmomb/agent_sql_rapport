[[case]]
id = "21-remise-au-transporteur"
question = "En jours fractionnaires, quel est le délai moyen entre l'approbation et la remise au transporteur ? Considère tous statuts et toutes dates, avec deux dates présentes et une remise au plus tôt à l'approbation. Arrondis à trois décimales."
sql = """
